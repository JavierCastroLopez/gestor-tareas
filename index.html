<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario & Gestor de Tareas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#9933FF">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="app-header">
      <div class="app-title">
        <h1><span class="accent">Calendario</span> Tasks</h1>
        <p>Tu productividad integrada</p>
      </div>
      <div class="app-actions">
        <button class="btn btn-new" id="newTaskBtn" aria-label="Nueva tarea (N)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Nueva tarea
        </button>
        <button class="btn btn-settings" aria-label="Configuración">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <div class="main-content">
      <!-- Left panel: Calendar -->
      <section class="panel calendar-panel">
        <div class="panel-header">
          <h2>Calendario</h2>
          <div class="calendar-nav">
            <button class="nav-btn prev" aria-label="Mes anterior">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <span id="currentMonth" class="nav-month"></span>
            <button class="nav-btn next" aria-label="Mes siguiente">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </section>

      <!-- Right panel: Task summary and actions -->
      <section class="panel summary-panel">
        <div class="panel-header">
          <h2>Resumen 7 Días</h2>
        </div>
        <div class="summary-grid" id="summaryGrid"></div>
      </section>
    </div>

    <!-- Bottom panel: Tasks list -->
    <section class="panel tasks-panel">
      <div class="panel-header">
        <h2>Tareas</h2>
        <div class="filter-controls">
          <select id="priorityFilter" aria-label="Filtrar por prioridad">
            <option value="all">Todas</option>
            <option value="baja">Baja</option>
            <option value="media">Media</option>
            <option value="alta">Alta</option>
            <option value="urgente">Urgente</option>
          </select>
          <select id="tagFilter" aria-label="Filtrar por etiqueta">
            <option value="all">Todas etiquetas</option>
          </select>
        </div>
      </div>
      <div class="tasks-list" id="tasksList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        No hay tareas. ¡Crea tu primera tarea con el botón "+"!
      </div>
    </section>
  </div>

  <!-- New Task Modal -->
  <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="display:none;">
    <div class="modal-content">
      <h2 id="modalTitle">Nueva tarea</h2>
      <button class="btn-close" aria-label="Cerrar (Esc)" onclick="closeTaskModal()">&times;</button>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-group">
          <label for="taskTitle">Título <span class="required">*</span></label>
          <input type="text" id="taskTitle" required placeholder="Escribe el título de la tarea">
        </div>
        <div class="form-group">
          <label for="taskDescription">Descripción</label>
          <textarea id="taskDescription" rows="3" placeholder="Descripción opcional"></textarea>
        </div>
        <div class="form-group">
          <label for="taskDueDate">Fecha límite</label>
          <input type="date" id="taskDueDate">
        </div>
        <div class="form-group">
          <label>Prioridad</label>
          <div class="priority-tags">
            <label class="priority-tag baja" data-value="baja">Baja</label>
            <label class="priority-tag media" data-value="media">Media</label>
            <label class="priority-tag alta" data-value="alta">Alta</label>
            <label class="priority-tag urgente" data-value="urgente">Urgente</label>
          </div>
        </div>
        <div class="form-group">
          <label>Etiquetas</label>
          <div class="tags-input" id="tagsInput">
            <input type="text" id="newTag" placeholder="Nueva etiqueta...">
            <div class="tags-chips" id="tagsChips"></div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeTaskModal()">Cancelar</button>
          <button type="submit" class="btn btn-primary" form="taskForm">Guardar tarea</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 7 AM Notification -->
  <div class="notification-banner" id="notificationBanner" style="display:none;">
    <div class="notification-content">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 1L3 5v6c0 5 5 12 5 12s5-7 5-12V5l-9-4z"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="12" y1="19" x2="12.01" y2="19"/>
      </svg>
      <span id="notificationText">Buenos días! Revisa tus tareas pendientes de los próximos 7 días.</span>
    </div>
    <button class="btn btn-small" onclick="testMorningAlert()">Simular aviso 7:00 AM</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
